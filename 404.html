<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — Stackly Health Insurance Portal" />
  <title>404 — Page Not Found — Stackly Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="error-body">
  <div class="error-container">
    <!-- Animated 404 -->
    <div class="error-visual">
      <div class="error-code">
        <span class="error-digit" data-digit="4">4</span>
        <span class="error-digit error-digit-zero" data-digit="0">
          <span class="error-orb">
            <span class="error-orb-ring"></span>
            <span class="error-orb-core"><i class="fa-solid fa-shield-halved"></i></span>
          </span>
        </span>
        <span class="error-digit" data-digit="4">4</span>
      </div>
      <div class="error-glow" aria-hidden="true"></div>
    </div>

    <!-- Content -->
    <div class="error-content">
      <h1>Page Not Found</h1>
      <p>Looks like this page took an unexpected turn. The link you followed may be broken or the page no longer exists.</p>

      <div class="error-actions">
        <button class="btn btn-primary btn-lg error-btn" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" class="btn btn-ghost btn-lg error-btn">
          <i class="fa-solid fa-house"></i> Go to Home
        </a>
      </div>
    </div>

    <!-- Footer hint -->
    <div class="error-footer">
      <p>Need help? <a href="contact.html" class="error-link">Contact Support</a></p>
    </div>
  </div>


</body>
</html>
