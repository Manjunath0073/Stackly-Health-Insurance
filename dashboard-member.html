<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stackly Health Insurance Member Dashboard" />
  <title>Dashboard — Stackly Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dash-body">
  <!-- SVG Filter for Logo -->
  <svg class="sr-only-svg" aria-hidden="true"><defs><filter id="logoRecolor"><feColorMatrix type="saturate" values="0" result="gray"/><feComponentTransfer result="blue"><feFuncR type="table" tableValues="0.145"/><feFuncG type="table" tableValues="0.388"/><feFuncB type="table" tableValues="0.922"/></feComponentTransfer><feBlend in="gray" in2="blue" mode="multiply"/><feComponentTransfer><feFuncA type="table" tableValues="0 1"/></feComponentTransfer></filter></defs></svg>

  <div class="dash-layout">
    <!-- Sidebar Overlay (mobile) -->
    <div class="dash-sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dashSidebar">
      <div class="ds-header">
        <a href="index.html" class="ds-brand">
          <img class="ds-brand-img" src="assets/images/logo-stackly.webp" alt="Stackly Health" width="1000" height="220" />
        </a>
        <button class="ds-close" id="sidebarClose" aria-label="Close sidebar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="ds-nav">
        <a href="#" class="ds-nav-link active" data-view="overview"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
        <a href="#" class="ds-nav-link" data-view="policies"><i class="fa-solid fa-shield-halved"></i><span>My Policies</span></a>
        <a href="#" class="ds-nav-link" data-view="claims"><i class="fa-solid fa-file-lines"></i><span>Claims</span></a>
        <a href="#" class="ds-nav-link" data-view="hospitals"><i class="fa-solid fa-hospital"></i><span>Hospitals</span></a>
        <a href="#" class="ds-nav-link" data-view="documents"><i class="fa-solid fa-folder-open"></i><span>Documents</span></a>
        <a href="#" class="ds-nav-link" data-view="settings"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      </nav>
      <div class="ds-sidebar-footer">
        <a href="#" class="ds-nav-link ds-logout" id="sidebarLogout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="dash-main">
      <!-- Top Bar -->
      <header class="dash-topbar">
        <div class="dt-left">
          <button class="dt-menu-toggle" id="sidebarToggle" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
          <div class="dt-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search..." aria-label="Search" />
          </div>
        </div>
        <div class="dt-right">
          <button class="dt-icon-btn" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="dt-badge">3</span>
          </button>
          <div class="dt-user">
            <div class="dt-avatar" id="userAvatar">M</div>
            <div class="dt-user-info">
              <span class="dt-user-name" id="userName">Member</span>
              <span class="dt-user-role" id="userRole">Member</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main class="dash-content" id="dashContent">
        <!-- Views loaded here by JS -->
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
